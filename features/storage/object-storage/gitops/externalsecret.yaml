# Secret RPC de Garage (64 caractères hexadécimaux), rangé dans Vault par
# l'opérateur (README, installation). Nom de clé imposé par le chart.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: garage-rpc-secret
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault
    kind: ClusterSecretStore
  target:
    name: garage-rpc-secret
    creationPolicy: Owner
  data:
    - secretKey: rpcSecret
      remoteRef:
        key: object-storage/garage
        property: rpc_secret
