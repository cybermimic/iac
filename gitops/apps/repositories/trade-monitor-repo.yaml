# Accès d'ArgoCD au dépôt PRIVÉ cybermimic/trade-monitor : clé de
# déploiement SSH en lecture seule, rangée dans Vault par l'opérateur
# (docs/plans/trade-monitor.md, commandes B). External Secrets fabrique le
# Secret « repository » qu'ArgoCD reconnaît par son label. github.com fait
# partie des clés d'hôte SSH connues par défaut d'ArgoCD.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: repo-trade-monitor
  namespace: argocd
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault
    kind: ClusterSecretStore
  target:
    name: repo-trade-monitor
    creationPolicy: Owner
    template:
      metadata:
        labels:
          argocd.argoproj.io/secret-type: repository
      data:
        type: git
        url: git@github.com:cybermimic/trade-monitor.git
        sshPrivateKey: "{{ .ssh_private_key }}"
  data:
    - secretKey: ssh_private_key
      remoteRef:
        key: argocd/repo-trade-monitor
        property: ssh_private_key
