name: validate

on:
  pull_request:
  push:
    branches: [main]

# Toutes les versions sont épinglées (runner, actions, outils) : un check qui
# change de comportement tout seul n'est pas un check. Les monter ensemble
# avec les versions locales (voir ./hack/test.sh).
env:
  # ansible-lint 26.1.1 exige yamllint >= 1.38.0 ; ansible-core épinglé
  # aussi (sinon ansible-lint tire la dernière version publiée).
  YAMLLINT_VERSION: "1.38.0"
  ANSIBLE_LINT_VERSION: "26.1.1"
  ANSIBLE_CORE_VERSION: "2.20.1"
  TERRAFORM_VERSION: "1.15.8"
  TERRAFORM_SHA256: "d25ce7b6902013ad905db3d2eab0be4cd905887fe88b81a6171b8d5503c31f3d"
  GITLEAKS_VERSION: "8.18.4"
  GITLEAKS_SHA256: "ba6dbb656933921c775ee5a2d1c13a91046e7952e9d919f9bac4cec61d628e7d"
  # Empreintes relevées dans les fichiers de sommes publiés par chaque projet
  # (helm-v4.3.0-linux-amd64.tar.gz.sha256sum, CHECKSUMS de kubeconform v0.8.0).
  HELM_VERSION: "4.3.0"
  HELM_SHA256: "86584a54def73570558f66f5111cc53dfed56689637ae32c1201205d494f54fb"
  KUBECONFORM_VERSION: "0.8.0"
  KUBECONFORM_SHA256: "9bc2bffbf71f261128533edaf912153948b7ff238f9a531ae6d34466ec287883"

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0 # gitleaks scanne tout l'historique, pas seulement le dernier commit

      # Un venv plutôt que `pip install` global : Ubuntu 24.04 refuse les
      # installations pip hors venv (PEP 668).
      - name: Install Python linters
        run: |
          python3 -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/pip" install --quiet \
            "yamllint==${YAMLLINT_VERSION}" "ansible-lint==${ANSIBLE_LINT_VERSION}" \
            "ansible-core==${ANSIBLE_CORE_VERSION}"
          echo "$RUNNER_TEMP/venv/bin" >> "$GITHUB_PATH"

      - name: yamllint
        run: yamllint --strict .

      # Binaire officiel plutôt que gitleaks-action, qui exige une licence
      # payante sur les repos d'organisation.
      - name: gitleaks
        run: |
          curl -sSLo "$RUNNER_TEMP/gitleaks.tar.gz" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  $RUNNER_TEMP/gitleaks.tar.gz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/gitleaks.tar.gz" -C "$RUNNER_TEMP" gitleaks
          "$RUNNER_TEMP/gitleaks" detect --source . --redact --verbose

      - name: shellcheck
        run: |
          if find . -name '*.sh' -not -path './.git/*' | grep -q .; then
            find . -name '*.sh' -not -path './.git/*' -print0 | xargs -0 shellcheck
          fi

      # Empreinte de la CA épinglée dans les scripts clients = certificat versionné.
      - name: homelab CA fingerprint
        run: ./hack/check-ca-fingerprint.sh

      # Windows PowerShell 5.1 lit les .ps1 sans BOM en Windows-1252.
      - name: powershell ascii
        run: ./hack/check-powershell-ascii.sh

      # Liens relatifs, numéros d'ADR uniques, sections des README de feature.
      - name: docs
        run: ./hack/check-docs.py

      - name: Install helm and kubeconform
        run: |
          curl -sSLo "$RUNNER_TEMP/helm.tar.gz" \
            "https://get.helm.sh/helm-v${HELM_VERSION}-linux-amd64.tar.gz"
          echo "${HELM_SHA256}  $RUNNER_TEMP/helm.tar.gz" | sha256sum -c -
          curl -sSLo "$RUNNER_TEMP/kubeconform.tar.gz" \
            "https://github.com/yannh/kubeconform/releases/download/v${KUBECONFORM_VERSION}/kubeconform-linux-amd64.tar.gz"
          echo "${KUBECONFORM_SHA256}  $RUNNER_TEMP/kubeconform.tar.gz" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/bin"
          tar -xzf "$RUNNER_TEMP/helm.tar.gz" -C "$RUNNER_TEMP" linux-amd64/helm
          mv "$RUNNER_TEMP/linux-amd64/helm" "$RUNNER_TEMP/bin/"
          tar -xzf "$RUNNER_TEMP/kubeconform.tar.gz" -C "$RUNNER_TEMP/bin" kubeconform
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"

      # Rend chaque Application ArgoCD comme ArgoCD (charts avec leurs valeurs,
      # dossiers de ce repo), valide les schémas, refuse les images et les
      # sources non épinglées. Les dépôts privés sont signalés SKIP.
      - name: argocd applications
        run: ./hack/check-apps.py

      - name: Install Terraform
        run: |
          curl -sSLo "$RUNNER_TEMP/terraform.zip" \
            "https://releases.hashicorp.com/terraform/${TERRAFORM_VERSION}/terraform_${TERRAFORM_VERSION}_linux_amd64.zip"
          echo "${TERRAFORM_SHA256}  $RUNNER_TEMP/terraform.zip" | sha256sum -c -
          unzip -q "$RUNNER_TEMP/terraform.zip" -d "$RUNNER_TEMP/bin"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"

      - name: terraform fmt
        run: terraform fmt -check -recursive infrastructure features

      # -backend=false : valide la configuration sans toucher à aucun state.
      - name: terraform validate
        working-directory: infrastructure/environments/homelab
        run: |
          terraform init -backend=false -input=false
          terraform validate

      - name: ansible-lint
        run: |
          ansible-galaxy collection install -r bootstrap/ansible/requirements.yml
          find bootstrap features -type d -name ansible -print0 | xargs -0 ansible-lint
