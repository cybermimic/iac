# Application business inner-riddle (dépôt privé, ADR-002) :
# https://inner-riddle.cybermimic.com. Ce repo ne contient que le contrat
# de déploiement ; le chart vit avec le code (deploy/chart).
#
# Synchronisation MANUELLE (application business, ADR-002 / ADR-008) :
# changer de version = modifier targetRevision ici (PR), puis « Sync »
# dans ArgoCD.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: inner-riddle
  namespace: argocd
spec:
  project: default
  sources:
    - repoURL: git@github.com:cybermimic/inner-riddle.git # accès : repositories/inner-riddle-repo.yaml
      targetRevision: v0.4.0 # version déployée (étiquette publiée par la CI)
      path: deploy/chart
      helm:
        valuesObject:
          host: inner-riddle.cybermimic.com
          # Connexion par Keycloak (ADR-012), realm inner-riddle.
          auth:
            mode: oidc
            # preferred_username Keycloak de l'opérateur : à sa première
            # connexion, ce compte reprend les cartes encore sans accès
            # (créées avant les droits par carte, IR-046).
            mapsOwner: victor
          oidc:
            # Pas de discoveryUrl : Keycloak n'a pas
            # hostname-backchannel-dynamic, le backend lit donc la
            # découverte à l'adresse publique (NAT en épingle de la Freebox).
            issuer: https://auth.cybermimic.com/realms/inner-riddle
          image:
            registry: 192.168.1.242
          imagePullSecrets:
            - name: registry-pull
          ingress:
            className: traefik # ingress public, namespace autorisé (ADR-009)
            # Validé en staging le 2026-10-16 ; certificat de production.
            clusterIssuer: letsencrypt
          persistence:
            storageClass: local-path
          externalSecret:
            enabled: true
            secretStoreRef:
              name: vault
              kind: ClusterSecretStore
            remoteKey: inner-riddle/auth # mode oidc : propriétés session_secret et oidc_client_secret (accounts n'est plus lu)
          networkPolicy:
            ingressNamespaces: [traefik]
          # Nœud unique, qui est aussi control-plane (même besoin que les
          # autres features : tolerate_control_plane_taint).
          tolerations:
            - key: node-role.kubernetes.io/control-plane
              operator: Exists
              effect: NoSchedule
    # Pull secret du registre.
    - repoURL: https://github.com/cybermimic/iac.git
      targetRevision: main
      path: gitops/inner-riddle
  destination:
    server: https://kubernetes.default.svc
    namespace: inner-riddle
  syncPolicy:
    # Pas de bloc « automated » : synchronisation manuelle.
    syncOptions:
      - CreateNamespace=true
    managedNamespaceMetadata:
      labels:
        # Les pods du chart respectent la politique « restricted ».
        pod-security.kubernetes.io/enforce: restricted
