# Mot de passe PostgreSQL (Vault secret/keycloak/postgres, clé
# "password" — généré et rangé par l'opérateur, jamais par ce repo).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: keycloak-postgres
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault
    kind: ClusterSecretStore
  target:
    name: keycloak-postgres
    creationPolicy: Owner
  dataFrom:
    - extract:
        key: keycloak/postgres
