# Même secret Vault que l'ExternalSecret d'inner-riddle (inner-riddle/auth),
# dupliqué dans le namespace keycloak : un Secret Kubernetes est namespacé,
# keycloak-config-cli (ici) et inner-riddle (dans son propre namespace)
# ont donc chacun leur ExternalSecret vers le même chemin Vault.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: inner-riddle-oidc-client-secret
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault
    kind: ClusterSecretStore
  target:
    name: inner-riddle-oidc-client-secret
    creationPolicy: Owner
    template:
      data:
        client-secret: "{{ .oidc_client_secret }}"
  data:
    - secretKey: oidc_client_secret
      remoteRef:
        key: inner-riddle/auth
        property: oidc-client-secret
