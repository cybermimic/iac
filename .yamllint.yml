extends: default

# CRDs de l'opérateur Keycloak copiées telles quelles depuis l'upstream
# (ADR-012) : elles ne respectent pas l'indentation par défaut, et les
# reformater rendrait chaque mise à jour illisible en revue (diff complet
# au lieu du vrai changement). kubernetes.yml, aussi vendorisé, reste
# vérifié : il passe, et il porte une modification locale (toleration).
ignore: |
  features/security/keycloak/gitops/operator/*.k8s.keycloak.org-v1.yml

# Les valeurs ci-dessous alignent yamllint sur ce qu'exige ansible-lint
# (https://docs.ansible.com/projects/lint/rules/yaml/) : sans elles,
# ansible-lint refuse la config et les deux outils se contredisent.
rules:
  line-length: disable
  document-start: disable
  braces:
    max-spaces-inside: 1
  comments:
    min-spaces-from-content: 1
  comments-indentation: false
  octal-values:
    forbid-implicit-octal: true
    forbid-explicit-octal: true
  # `on:` des workflows GitHub Actions est une clé, pas un booléen.
  truthy:
    allowed-values: ["true", "false"]
    check-keys: false
