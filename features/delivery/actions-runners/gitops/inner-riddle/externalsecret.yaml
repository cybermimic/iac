# Identifiants de la GitHub App des runners, rangés dans Vault par
# l'opérateur (docs/plans/inner-riddle.md, commandes D). Noms de clés
# imposés par ARC.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: arc-github-app
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault
    kind: ClusterSecretStore
  target:
    name: arc-github-app
    creationPolicy: Owner
  dataFrom:
    - extract:
        key: actions-runners/github-app
