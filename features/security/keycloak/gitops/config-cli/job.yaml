# Applique les realms versionnés dans ce dossier, de façon idempotente
# (ADR-012). ArgoCD recrée ce Job à chaque sync (hook Sync, substitué par
# un nouveau Job à chaque changement de contenu via l'annotation
# BeforeHookCreation).
apiVersion: batch/v1
kind: Job
metadata:
  name: keycloak-config-cli
  annotations:
    argocd.argoproj.io/hook: Sync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
spec:
  template:
    spec:
      restartPolicy: OnFailure
      tolerations:
        - key: node-role.kubernetes.io/control-plane
          operator: Exists
          effect: NoSchedule
      containers:
        - name: keycloak-config-cli
          # Convention de tag réelle de cette image : <version-cli>-<version-keycloak>,
          # pas "vX.Y.Z" (erreur initiale, image introuvable). 26.5.5 est la
          # version Keycloak la plus récente disponible pour ce tag de CLI au
          # moment de l'écriture — l'API d'admin Keycloak est stable au sein
          # d'une même ligne majeure (26.x), l'écart avec le serveur (26.8.1)
          # n'est pas bloquant.
          image: adorsys/keycloak-config-cli:6.5.1-26.5.5 # jamais latest, voir CLAUDE.md
          env:
            - name: KEYCLOAK_URL
              value: http://keycloak-service.keycloak.svc:8080
            - name: KEYCLOAK_AVAILABILITYCHECK_ENABLED
              value: "true"
            - name: KEYCLOAK_AVAILABILITYCHECK_TIMEOUT
              value: 120s
            - name: KEYCLOAK_SSL_VERIFY
              value: "false" # interne au cluster, backend en HTTP (voir keycloak.yaml)
            - name: KEYCLOAK_USER
              valueFrom:
                secretKeyRef:
                  name: keycloak-admin
                  key: username
            - name: KEYCLOAK_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: keycloak-admin
                  key: password
            - name: IMPORT_VARSUBSTITUTION_ENABLED
              value: "true"
            - name: INNER_RIDDLE_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: inner-riddle-oidc-client-secret
                  key: client-secret
            - name: IMPORT_FILES_LOCATIONS
              value: /config/*.yaml
          volumeMounts:
            - name: realms
              mountPath: /config
      # Volume projeté : combine les ConfigMaps des différents realms dans
      # le même répertoire, pour que IMPORT_FILES_LOCATIONS=/config/*.yaml
      # les importe tous sans avoir à lister chaque fichier.
      volumes:
        - name: realms
          projected:
            sources:
              - configMap:
                  name: keycloak-realm-inner-riddle
              - configMap:
                  name: keycloak-realm-master
