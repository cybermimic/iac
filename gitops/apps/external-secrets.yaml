apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: external-secrets
  namespace: argocd
spec:
  project: default
  sources:
    # Chart officiel : installe l'opérateur (CRDs, contrôleurs, webhook).
    - repoURL: https://charts.external-secrets.io
      chart: external-secrets
      targetRevision: 2.12.0 # jamais latest, voir CLAUDE.md
      helm:
        valuesObject:
          installCRDs: true
          tolerations:
            - key: node-role.kubernetes.io/control-plane
              operator: Exists
              effect: NoSchedule
          webhook:
            tolerations:
              - key: node-role.kubernetes.io/control-plane
                operator: Exists
                effect: NoSchedule
          certController:
            tolerations:
              - key: node-role.kubernetes.io/control-plane
                operator: Exists
                effect: NoSchedule
    # ClusterSecretStore : propre à ce homelab, pas fourni par le chart.
    - repoURL: https://github.com/cybermimic/iac.git
      targetRevision: main
      path: features/security/external-secrets/gitops
  destination:
    server: https://kubernetes.default.svc
    namespace: external-secrets
  syncPolicy:
    automated:
      selfHeal: true
      # Pas de prune (ADR-008).
    syncOptions:
      - CreateNamespace=true
