extends: default

# Les valeurs ci-dessous alignent yamllint sur ce qu'exige ansible-lint
# (https://docs.ansible.com/projects/lint/rules/yaml/) : sans elles,
# ansible-lint refuse la config et les deux outils se contredisent.
rules:
  line-length: disable
  document-start: disable
  braces:
    max-spaces-inside: 1
  comments:
    min-spaces-from-content: 1
  comments-indentation: false
  octal-values:
    forbid-implicit-octal: true
    forbid-explicit-octal: true
  # `on:` des workflows GitHub Actions est une clé, pas un booléen.
  truthy:
    allowed-values: ["true", "false"]
    check-keys: false
