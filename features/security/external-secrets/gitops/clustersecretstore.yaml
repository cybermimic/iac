apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: vault
spec:
  provider:
    vault:
      # Vault sur sa propre IP, en TLS (ADR-009). Pas le nom de Service
      # interne (vault.vault.svc) : le certificat de Vault ne contient que
      # des IP, la CA interne ne pouvant signer que des noms sous homelab.lan.
      server: https://192.168.1.243:8200
      # Certificat PUBLIC de « Homelab Root CA » (docs/homelab-root-ca.crt,
      # encodé en base64) pour vérifier le certificat de Vault. Doit rester
      # identique à ce fichier : vérifié par hack/check-ca-fingerprint.sh.
      caBundle: 
      path: secret
      version: v2
      auth:
        kubernetes:
          mountPath: kubernetes
          role: external-secrets
          serviceAccountRef:
            name: external-secrets
            namespace: external-secrets
            # Jeton demandé pour Vault seulement. Le rôle Vault exige cette
            # audience (audience=vault) : un jeton de service account
            # ordinaire, volé ailleurs dans le cluster, y est refusé. Les
            # deux valeurs vont ensemble : en changer une seule casse
            # toutes les ExternalSecret.
            audiences:
              - vault
