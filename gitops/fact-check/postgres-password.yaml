# Mot de passe PostgreSQL de fact-check, GÉNÉRÉ (ADR-014, P1) — secret pilote.
#
#   Password ─► ExternalSecret « …-generated » (CreatedOnce) ─► Secret local
#            ─► PushSecret (IfNotExists) ─► Vault secret/fact-check/postgres
#            ─► ExternalSecret du chart (lit Vault) ─► Secret « fact-check-postgres »
#
# Le chart lit TOUJOURS Vault, jamais le Secret généré : après une restauration
# de Vault, la valeur restaurée gagne (IfNotExists n'écrase rien) et reste
# cohérente avec la base restaurée.
apiVersion: generators.external-secrets.io/v1alpha1
kind: Password
metadata:
  name: fact-check-postgres-password
spec:
  # 24 octets aléatoires encodés en hexadécimal (48 caractères) : le mot de
  # passe entre tel quel dans l'URL de connexion (chart de fact-check).
  length: 24
  encoding: hex
  digits: 6
  symbols: 0
  noUpper: false
  allowRepeat: true
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: fact-check-postgres-generated
spec:
  # Généré une seule fois : jamais régénéré tant que le Secret existe.
  refreshPolicy: CreatedOnce
  target:
    name: fact-check-postgres-generated
    creationPolicy: Owner
  dataFrom:
    - sourceRef:
        generatorRef:
          apiVersion: generators.external-secrets.io/v1alpha1
          kind: Password
          name: fact-check-postgres-password
---
apiVersion: external-secrets.io/v1alpha1
kind: PushSecret
metadata:
  name: fact-check-postgres
spec:
  # Écrit dans Vault seulement si la valeur n'y est pas (infra vierge) ; ne
  # supprime rien dans Vault si cette ressource disparaît.
  updatePolicy: IfNotExists
  deletionPolicy: None
  refreshInterval: 1h
  secretStoreRefs:
    - name: vault
      kind: ClusterSecretStore
  selector:
    secret:
      name: fact-check-postgres-generated
  data:
    - match:
        secretKey: password
        remoteRef:
          remoteKey: fact-check/postgres
          property: password
