---
# Prérequis kubeadm : modules noyau + sysctl pour le forwarding réseau des
# pods. Sans ça, Calico ne route pas correctement entre pods.
- name: Load required kernel modules
  community.general.modprobe:
    name: "{{ item }}"
    state: present
    persistent: present
  loop:
    - overlay
    - br_netfilter

- name: Set sysctl params required by Kubernetes networking
  ansible.posix.sysctl:
    name: "{{ item.name }}"
    value: "{{ item.value }}"
    sysctl_set: true
    state: present
    reload: true
  loop:
    - { name: net.bridge.bridge-nf-call-iptables, value: "1" }
    - { name: net.bridge.bridge-nf-call-ip6tables, value: "1" }
    - { name: net.ipv4.ip_forward, value: "1" }

- name: Install containerd
  ansible.builtin.apt:
    name: containerd
    state: present
    update_cache: true
    cache_valid_time: 3600

- name: Hold containerd package (never auto-upgrade silently)
  ansible.builtin.dpkg_selections:
    name: containerd
    selection: hold

- name: Ensure /etc/containerd exists
  ansible.builtin.file:
    path: /etc/containerd
    state: directory
    mode: "0755"

- name: Check whether a containerd config already exists
  ansible.builtin.stat:
    path: "{{ containerd_config_path }}"
  register: containerd_config_stat

# Ne génère la config par défaut que si absente : ne jamais écraser une
# config existante (potentiellement personnalisée en prod).
- name: Generate default containerd config
  ansible.builtin.shell:
    cmd: containerd config default > {{ containerd_config_path }}
  when: not containerd_config_stat.stat.exists
  notify: restart containerd

# Gotcha connu kubeadm+containerd : sans SystemdCgroup=true, kubelet et
# containerd utilisent des cgroup drivers différents et le nœud ne devient
# jamais Ready.
- name: Ensure SystemdCgroup is enabled for the runc runtime
  ansible.builtin.lineinfile:
    path: "{{ containerd_config_path }}"
    regexp: '^(\s*)SystemdCgroup\s*='
    line: '            SystemdCgroup = true'
    backrefs: true
  notify: restart containerd

- name: Ensure containerd is enabled and running
  ansible.builtin.systemd:
    name: containerd
    enabled: true
    state: started
