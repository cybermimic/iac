# Compte admin initial (Vault secret/keycloak/admin, clés "username" et
# "password" — généré et rangé par l'opérateur). Protégé par 2FA dès la
# première connexion (ADR-012) ; sert uniquement au bootstrap du realm
# master, pas aux realms applicatifs.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: keycloak-admin
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault
    kind: ClusterSecretStore
  target:
    name: keycloak-admin
    creationPolicy: Owner
  dataFrom:
    - extract:
        key: keycloak/admin
