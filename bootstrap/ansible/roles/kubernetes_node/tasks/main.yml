---
- name: Disable swap (required by kubeadm)
  ansible.builtin.command: swapoff -a
  when: ansible_swaptotal_mb > 0
  changed_when: true

- name: Remove swap entries from /etc/fstab
  ansible.builtin.replace:
    path: /etc/fstab
    regexp: '^([^#].*\sswap\s.*)$'
    replace: '# \1'

- name: Install apt prerequisites
  ansible.builtin.apt:
    name:
      - apt-transport-https
      - ca-certificates
      - curl
      - gpg
    state: present
    update_cache: true
    cache_valid_time: 3600

- name: Ensure /etc/apt/keyrings exists
  ansible.builtin.file:
    path: /etc/apt/keyrings
    state: directory
    mode: "0755"

- name: Fetch Kubernetes apt signing key
  ansible.builtin.get_url:
    url: "https://pkgs.k8s.io/core:/stable:/v{{ kubernetes_node_series }}/deb/Release.key"
    dest: /tmp/kubernetes-release.key
    mode: "0644"
  changed_when: false

- name: Dearmor Kubernetes apt signing key
  ansible.builtin.shell:
    cmd: "gpg --dearmor -o {{ kubernetes_node_apt_keyring }} < /tmp/kubernetes-release.key"
    creates: "{{ kubernetes_node_apt_keyring }}"

- name: Add Kubernetes apt repository
  ansible.builtin.apt_repository:
    repo: "deb [signed-by={{ kubernetes_node_apt_keyring }}] https://pkgs.k8s.io/core:/stable:/v{{ kubernetes_node_series }}/deb/ /"
    filename: kubernetes
    state: present
    update_cache: true

- name: Install kubelet, kubeadm, kubectl
  ansible.builtin.apt:
    name:
      - kubelet
      - kubeadm
      - kubectl
    state: present

- name: Hold Kubernetes packages (never auto-upgrade silently)
  ansible.builtin.dpkg_selections:
    name: "{{ item }}"
    selection: hold
  loop:
    - kubelet
    - kubeadm
    - kubectl

- name: Ensure kubelet is enabled
  ansible.builtin.systemd:
    name: kubelet
    enabled: true
    state: started
    # kubelet reste en crashloop tant que /etc/kubernetes/kubelet.conf
    # n'existe pas — normal avant `kubeadm init`/`kubeadm join`, qui restent
    # des étapes manuelles et délibérées, hors de ce rôle.
