# Fichier htpasswd de Zot (comptes ci-push et cluster-pull), rangé dans
# Vault par l'opérateur (docs/plans/inner-riddle.md, commandes B).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: zot-htpasswd
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault
    kind: ClusterSecretStore
  target:
    name: zot-htpasswd
    creationPolicy: Owner
  data:
    - secretKey: htpasswd
      remoteRef:
        key: registry/htpasswd
        property: htpasswd
